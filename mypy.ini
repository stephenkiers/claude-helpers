[mypy]
# Type checking configuration for scripts/workflow/, scripts/spike-effort.py, scripts/precedent-log.py, scripts/precedent-digest.py, scripts/flow-ledger.py, scripts/primary-checkout-drift.py, and scripts/flow-verify-receipt.py

# Files to check: directory and individual script files
files = scripts/workflow,scripts/spike-effort.py,scripts/precedent-log.py,scripts/precedent-digest.py,scripts/flow-ledger.py,scripts/primary-checkout-drift.py,scripts/flow-verify-receipt.py

# Name modules from the repo root so scripts/workflow/checks.py is one module (scripts.workflow.checks),
# not also "workflow.checks": flow-verify-receipt.py imports it by the former name.
explicit_package_bases = True
mypy_path = .

# Python version target (must match install.sh's floor: 3.8+)
python_version = 3.8

# Strictness settings
disallow_untyped_defs = True
check_untyped_defs = True

# Cache directory (must not drift into install.sh-mirrored dirs like commands/, reviewers/, etc)
cache_dir = .mypy_cache

# Notes on strictness:
# - disallow_untyped_defs is stricter than --strict in one important way:
#   it requires all function/method signatures to be fully annotated.
# - --strict would require even more (implicit Optional, error codes, etc.)
#   and is a documented future goal as the codebase matures and dependencies
#   grow more type-aware. For now, disallow_untyped_defs is the right floor:
#   it catches function signature holes without requiring @overload expansion
#   or stub-package maintenance for third-party libraries.

# flow-verify-receipt.py imports these two sibling leaf modules bare (it adds its own directory to
# sys.path at runtime). Putting scripts/ on mypy_path would also expose scripts/workflow as the
# module "workflow", so they are left untyped here instead.
[mypy-plan_checkpoint_schema,flow_log]
ignore_missing_imports = True
