# Reviewer Index
# Quick reference for all available reviewers with their triggers and use cases
# Single source of truth for routing triggers (ADR-0003). Persona files do not carry triggers; edit them here.
# Contexts (review|plan|write) and resolution precedence: see reviewers/README.md § Contexts and resolution precedence
#
# triggers: and useWhen remain the Router's live inputs (ADR-0003).
# route: is read ONLY by scripts/route-score.py in shadow mode (observe-only, #195).
# All include_at/candidate_at/N values are PROVISIONAL, untuned until Phase 3 (#196).

reviewers:
  - name: Know-It-All Nigel
    file: know-it-all-nigel.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Any code changes - polyglot idiom checker for language-specific best practices
    triggers: ["*.ts", "*.rs", "*.go", "*.py", "*.js", def, async, await, match, unwrap]
    route:
      paths: ["**/*.ts", "**/*.rs", "**/*.go", "**/*.py", "**/*.js"]
      strong: [def, match, unwrap]
      weak: [async, await]
      include_at: 6
      candidate_at: 3

  - name: Uncle Bob
    file: uncle-bob.yaml
    priority: high
    contexts: {review: secondary, plan: primary}
    useWhen: Resource acquire/release correctness — naming and single-responsibility for resource types, lifecycle coordination, timeout/deadline handling, cleanup patterns
    triggers: [open, close, drop, dispose, new, create, acquire, release, shutdown, stop, terminate, timeout, deadline, spawn, thread, task, finally, cleanup]
    route:
      strong: [open, close, acquire, release, shutdown, stop, terminate, spawn, thread, finally]
      weak: [new, create, timeout, deadline, task, cleanup]
      include_at: 6
      candidate_at: 3

  - name: Security Sage
    file: security-sage.yaml
    priority: critical
    contexts: {review: primary, plan: primary}
    useWhen: APIs, auth, user input, secrets, external systems, error handling
    triggers: [parse, deserialize, env, exec, spawn, secret, token, password, unwrap, path, url, sanitize]
    route:
      strong: [parse, deserialize, exec, spawn, secret, token, password, sanitize]
      weak: [env, unwrap, path, url]
      include_at: 6
      candidate_at: 3

  - name: Tara TypeSafe
    file: tara-typesafe.yaml
    priority: critical
    contexts: {review: primary, plan: primary}
    useWhen: Type design, contracts, validation, state machines, API boundaries
    triggers: [interface, type, struct, trait, any, unknown, as, "as any", unsafe, Zod, schema, invariant, assert, debug_assert, must, never, always, validate]
    route:
      strong: [interface, struct, trait, unsafe, schema, invariant, validate]
      weak: [type, any, unknown, Zod, assert, must]
      include_at: 6
      candidate_at: 3

  - name: Sam System
    file: sam-system.yaml
    priority: critical
    contexts: {review: primary, plan: primary}
    useWhen: Cross-file composition, factory wiring, event bus connections, data flow tracing
    triggers: [createSession, createService, factory, bus, eventBus, config, options, inject, provider, compose]
    note: "Special reviewer - when selected, receives FULL diff (not just tagged sections). Traces data flow across files."
    route:
      strong: [factory, bus, eventBus, inject, compose]
      weak: [createSession, createService, config, options, provider]
      shape:
        cross_file_symbol: 3
        file_count_ge: {points: 2, n: 3}
      include_at: 6
      candidate_at: 3

  - name: North Star Nick
    file: north-star-nick.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Any architectural change, new modules, scope-affecting work, pattern decisions
    triggers: [new files, package.json, Cargo.toml, ADR, milestone, phase, scope, architecture, migrate, refactor]
    note: "Strategic alignment reviewer. Loads ADRs, issues index, and product docs. Cross-references diff against documented decisions. Review participation is subject to diff-shape gating in prompts/expert-review-panel.md."
    route:
      paths: ["docs/adr/**"]
      strong: [architecture, refactor]
      weak: [migrate]
      shape: {adr_touched: 3, dep_manifest: 3, new_files: 1}
      include_at: 6
      candidate_at: 3

  - name: Rachel
    file: rachel.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Concurrency, async code, shared state, locks, channels
    triggers: [thread, spawn, join, async, await, Future, Promise, Mutex, RwLock, Arc, Atomic, lock, unlock, synchronized, channel, mpsc, broadcast, Send, Sync, static mut, lazy_static, OnceCell, Rc, RefCell]
    route:
      strong: [Mutex, lock, atomic]
      weak: [async, await]
      include_at: 6
      candidate_at: 3

  - name: Eric Evans
    file: eric-evans.yaml
    priority: medium
    contexts: {review: named-only, plan: primary}
    useWhen: Domain modeling, bounded contexts, naming, cross-package imports
    triggers: [import, use, from, interface, type, struct, trait, contracts/, core/, services/]
    note: "Code review participation is naming-only in Phase 1; plan participation is primary."
    route:
      paths: ["contracts/**", "core/**", "services/**"]
      strong: [interface, struct, trait]
      include_at: 6
      candidate_at: 3

  - name: Business Beth
    file: business-beth.yaml
    priority: medium
    contexts: {review: named-only, plan: primary}
    useWhen: New features, user-facing changes, scope validation, value alignment
    triggers: [feature, user, customer, UI components, API routes]
    note: "Code review participation is naming-only in Phase 1; plan participation is primary."
    route:
      paths: ["**/routes/**", "**/*api*", "**/*ui*"]
      strong: [feature, customer]
      weak: [user]
      shape: {ui_paths: 2}
      include_at: 6
      candidate_at: 3

  - name: Penny Pincher
    file: penny-pincher.yaml
    priority: medium
    contexts: {review: named-only, plan: primary}
    useWhen: New abstractions, infrastructure, large refactors, build vs buy decisions
    triggers: [abstract, generic, factory, builder, new dependencies]
    note: "Code review participation is naming-only in Phase 1; plan participation is primary."
    route:
      strong: [factory, builder, generic]
      weak: [abstract]
      shape: {dep_manifest: 2}
      include_at: 6
      candidate_at: 3

  - name: Curious Casey
    file: curious-casey.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Untested or unexplained code — coverage gaps, magic numbers, undocumented decisions, jargon, onboarding friction. Any diff, test files or not.
    triggers: [test, "#[test]", assert, mock, complex logic, TODO, FIXME, config, export]
    route:
      strong: [assert, mock, TODO, FIXME, export]
      weak: [test, config]
      shape: {test_files: 2}
      include_at: 6
      candidate_at: 3

  - name: Vera Verifier
    file: vera-verifier.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Tests, or numeric/loop/accumulator production code whose correctness needs execution tracing.
    triggers: ["*.test.*", "*.spec.*", "*_test.rs", "tests/*", "*/tests/*", "Tests/*", "*/Tests/*", "test/*", "*/test/*", expect, vi.fn, yield, "for await", "next(", done, generator, flush, reduce]
    note: "Desk-checks tests by mentally executing them step-by-step against the implementation. Catches tests that pass for the wrong reason, comment/name inaccuracies, protocol misunderstandings (async generators, iterator done vs chunk type), and mock fidelity issues. Complements Casey (coverage) and Ariadne (production paths)."
    route:
      paths: ["**/*.test.*", "**/*.spec.*", "**/tests/**", "**/test/**", "**/Tests/**"]
      strong: [expect, reduce, yield, generator]
      weak: ["vi.fn", await, done, flush]
      shape: {test_files: 2}
      include_at: 6
      candidate_at: 3

  - name: Danielle the Designer
    file: danielle-designer.yaml
    priority: medium
    contexts: {review: primary, plan: primary}
    useWhen: UI/UX, user flows, error messages, forms, CLI interfaces
    triggers: [button, input, form, modal, dialog, toast, error, message, loading, navigate, --help]
    route:
      strong: [button, modal, dialog, form]
      weak: [input, toast, error, message, loading, navigate]
      shape: {ui_paths: 2}
      include_at: 6
      candidate_at: 3

  - name: Dependency Skeptic
    file: dependency-skeptic.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: New dependencies, version changes, platform-specific code, FFI
    triggers: [Cargo.toml, package.json, pyproject.toml, requirements.txt, go.mod, cfg, extern, platform-specific paths]
    route:
      paths: [Cargo.toml, package.json, pyproject.toml, requirements.txt, go.mod]
      strong: [extern]
      weak: [cfg]
      shape: {dep_manifest: 3}
      include_at: 6
      candidate_at: 3

  - name: Mozart
    file: mozart-eda.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Composition/orchestration of independent pieces, and event-driven architecture — pub/sub, event buses, channels, callbacks, message passing
    triggers: [event, EventBus, Subject, Observable, subscribe, publish, emit, dispatch, channel, broadcast, handler, compose]
    note: "Composition + EDA specialist. Project-specific extensions live in your project's .claude/reviewers/mozart-local.yaml"
    route:
      strong: [EventBus, Observable, subscribe, publish, dispatch, compose]
      weak: [event, emit, channel, broadcast, handler]
      shape: {cross_file_symbol: 2}
      include_at: 6
      candidate_at: 3


  - name: Data Scientist Dana
    file: data-scientist-dana.yaml
    priority: high
    contexts: {review: primary, plan: named-only}
    useWhen: Knowledge base JSON changes, cross-file references, schema conformance, duplicate detection, source traceability
    triggers: [sources, src_, person_, comm_, evt_, issue_, related_issues, participants, shared_profile, content_hashes, _meta.json, "*.json"]
    note: "Data quality and schema integrity specialist. Fills the gap no other reviewer covers: referential integrity across JSON knowledge files, duplicate detection, enum validation, bidirectional link consistency, and source traceability chains. Review participation is path-conditioned on data files by existing triggers."
    route:
      paths: ["**/*.json", "**/*sources*", "**/*_meta*", "*.json"]
      strong: [sources, participants]
      include_at: 6
      candidate_at: 3

  - name: Frontend Fred
    file: frontend-fred.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: React/Svelte/Vue components, hooks, effects, subscriptions, imperative objects managed by component lifecycle
    triggers: ["*.tsx", "*.jsx", "*.svelte", "*.vue", useState, useEffect, useRef, useCallback, useMemo, useContext, useReducer, useMutation, useQuery, onMount, onDestroy, onCleanup, createSignal, createEffect, "$state", "$effect", "$derived", writable, readable, derived, subscribe, ref, reactive, computed, watch, watchEffect, onMounted, onUnmounted]
    note: "Component lifecycle specialist. Catches unmount races, stale closures, prop-change races, subscription leaks, and imperative-to-declarative boundary bugs. Born from a blind spot where no other reviewer covered React lifecycle semantics."
    route:
      paths: ["**/*.tsx", "**/*.jsx", "**/*.svelte", "**/*.vue"]
      strong: [useState, useEffect, useRef, useCallback, useMemo, onMount, onDestroy, onCleanup, createSignal, createEffect, writable]
      weak: [useContext, useReducer, useMutation, useQuery, derived, subscribe, ref, reactive, computed, watch, watchEffect, onMounted, onUnmounted]
      shape: {ui_paths: 3}
      include_at: 6
      candidate_at: 3

  - name: Scope Creep Steve
    file: scope-creep-steve.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Protocols, handshakes, lifecycle coordination, session management, timeouts, acks, state machines
    triggers: [handshake, ack, protocol, session, lifecycle, backoff]
    note: "Production readiness at scale. Asks 'what breaks with 1,000 users?' Proposes scope creep when the fix is cheap now and expensive later. Labels findings as FIX NOW / TRACK / DEFER. Penny Pincher's natural adversary."
    route:
      strong: [handshake, protocol, lifecycle]
      weak: [ack, session, backoff]
      include_at: 6
      candidate_at: 3

  - name: Code Rot Cody
    file: code-rot-cody.yaml
    priority: high
    model: haiku
    contexts: {review: primary}
    useWhen: Any PR — verifies new symbols have callers, removed symbols are fully cleaned up, config fields are end-to-end connected
    triggers: ["new exported symbols", "removed symbols", "config fields"]
    note: "Mechanical dead code and orphan detector. Always runs on the FULL diff (ADR-0003 full-diff exception) — triggers above are descriptive, not routing filters. Greps the entire repo to verify every new symbol is called and every removed symbol is fully cleaned up. Catches dead code, unused config fields, and widowed helpers that no domain reviewer looks for."
    route:
      always: true

  - name: Fragile Feynman
    file: fragile-feynman.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Any diff touching business logic, data pipelines, config handling, or state management
    triggers: [default, assume, always, never, order, sorted, transform, pipeline, config, global, shared, singleton, retry, timeout, version, migrate, schema]
    note: "Pre-mortem fragility analyst. Runs the 10-category fragility catalogue against every diff and writes fictional post-mortems for FRAGILE/CRITICAL findings. Reads fragility.highRiskModules and fragility.knownFragilePatterns from .claude/project.yaml."
    route:
      strong: [pipeline, config, global, shared, singleton, retry, timeout, migrate, schema]
      weak: [default, assume, never, order, sorted, transform, version]
      include_at: 6
      candidate_at: 3

  - name: Contract Chris
    file: contract-chris.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: New or modified public functions, service layer changes, library code, data validation, external system calls
    triggers: [def, fn, "pub fn", raises, throws, Optional, Result, except, catch, unwrap, validate, precondition]
    note: "Contract completeness reviewer. Applies 4-question analysis per function: input invariants, violation behavior (explicit vs implicit), external state errors, silenced errors. Suggests docstrings in the project's docStyle from .claude/project.yaml."
    route:
      strong: [def, raises, throws, Optional, Result, validate, precondition]
      weak: [fn, except, catch, unwrap]
      shape: {exports_changed: 2}
      include_at: 6
      candidate_at: 3

  - name: Ariadne
    file: ariadne.yaml
    priority: high
    contexts: {review: primary, plan: primary}
    useWhen: Control flow paths, error handling, exception propagation, cleanup correctness, iterator protocols
    triggers: [try, catch, finally, throw, return, switch, match, await, yield, async]
    note: "Control flow path analyzer. Traces every branch from entry to exit and verifies each path produces the correct outcome. Catches bugs that only manifest on unexpected paths."
    route:
      strong: [try, finally, throw, return, switch, match]
      weak: [catch, await, yield, async]
      include_at: 6
      candidate_at: 3

  - name: Contrarian Carl
    file: contrarian-carl.yaml
    priority: low
    contexts: {review: primary, plan: primary}
    useWhen: Any code changes - finds what other reviewers missed, questions shared assumptions
    triggers: ["*"]
    note: "Devil's advocate reviewer. Runs last, sees all other findings, deliberately looks in different directions to catch groupthink and blind spots. Always-run behavior lives in panel prose, not in the context tag."
    route:
      always: true

  - name: Consistency Checker
    file: consistency-checker.yaml
    priority: high
    model: haiku
    contexts: {review: primary}
    useWhen: Any diff - scans for pattern inconsistencies within and across files
    triggers: ["*"]
    note: "Pattern-matching mechanical reviewer. Finds places where code uses pattern X here but pattern Y elsewhere for the same purpose, and verifies PR description matches code."
    route:
      always: true

  - name: Demosthenes
    file: editor-audience.yaml
    priority: medium
    contexts: {write: primary}
    useWhen: Documentation, user-facing writing, API descriptions, error messages
    note: "Audience editor — editorial persona for /expert-write. No diff triggers. Evaluates audience fit, jargon, clarity."

  - name: Shakespeare
    file: editor-cadence.yaml
    priority: medium
    contexts: {write: primary}
    useWhen: Documentation structure, pacing, section organization, information architecture
    note: "Cadence editor — editorial persona for /expert-write. No diff triggers. Evaluates flow, rhythm, and information sequencing."

  - name: Strunk
    file: editor-signal.yaml
    priority: medium
    contexts: {write: primary}
    useWhen: Documentation emphasis, key points, narrative focus, prominence of important information
    note: "Signal editor — editorial persona for /expert-write. No diff triggers. Evaluates what stands out and what should."

  - name: Fact-Check Fiona
    file: fact-check-fiona.yaml
    priority: high
    contexts: {review: primary, plan: named-only, write: secondary}
    useWhen: New or modified KB claims (facts, quotes, proposals, problems, source summaries, person attributions) — audits whether each claim's wording is fully supported by its cited source.
    triggers: [kb/facts, kb/quotes, kb/proposals, kb/problems, kb/sources-registry, confidence, evidence_type, source_refs, confirmed, always, never, unlike]
    note: "Epistemic claim auditor for knowledge bases. Complements Data Scientist Dana (structural integrity) by checking claim-strength-vs-evidence: overstatement, unsourced clauses, inference-as-fact, confidence calibration. Review participation is path-conditioned on kb/ paths by existing triggers."
    route:
      paths: ["kb/**"]
      strong: [confidence, evidence_type, source_refs]
      weak: [confirmed]
      include_at: 6
      candidate_at: 3

# Reviewers whose domain can be fully expressed in a single file or single line
# (a hardcoded secret, a shell injection, an unescaped path, a race). A structural
# diff-shape precondition can never prove their domain does not apply, so they are
# permanently ineligible for Sam-System-style pre-Router exclusion. See
# prompts/expert-review-panel.md and ADR-0003.2.
structural_pre_gate_ineligible: [security-sage, rachel, tara-typesafe, contract-chris]
